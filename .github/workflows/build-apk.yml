name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Prepare project
        run: |
          set -e
          if [ -f index.html ]; then f="index.html"; else f="$(ls -1 *.html 2>/dev/null | head -n 1)"; fi
          test -n "$f" || { echo "ERROR: no html file found in the repo root"; exit 1; }
          echo "Using file: $f"
          grep -q "refundAsk" "$f" || { echo "ERROR: this is an OLD version of the app. Upload the latest index.html"; exit 1; }
          mkdir -p www native
          cp "$f" www/index.html
          cat > www/manifest.webmanifest <<'EOF'
          {"name":"Mobile Cashier","short_name":"Cashier","start_url":"./index.html","display":"standalone","background_color":"#F4FAF8","theme_color":"#006B5E","lang":"ar","dir":"rtl"}
          EOF
          cat > package.json <<'EOF'
          {"name":"mobile-cashier","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^7.0.0","@capacitor/cli":"^7.0.0","@capacitor/core":"^7.0.0","@capacitor/filesystem":"^7.0.0","@capacitor/share":"^7.0.0"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.mobilecashier.app","appName":"موبايل كاشير","webDir":"www"}
          EOF
          cat > native/NativePrint.java <<'EOF'
          package com.mobilecashier.app;

          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NativePrint")
          public class NativePrint extends Plugin {
              @PluginMethod
              public void print(final PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      try {
                          PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                          PrintDocumentAdapter adapter = bridge.getWebView().createPrintDocumentAdapter("cashier");
                          pm.print("cashier", adapter, new PrintAttributes.Builder().build());
                          call.resolve();
                      } catch (Exception e) {
                          call.reject(e.getMessage());
                      }
                  });
              }
          }
          EOF
          cat > native/MainActivity.java <<'EOF'
          package com.mobilecashier.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativePrint.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
      - name: Build APK
        run: |
          set -e
          npm install
          npx cap add android
          D=android/app/src/main/java/com/mobilecashier/app
          mkdir -p $D
          cp native/NativePrint.java native/MainActivity.java $D/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cashier-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
